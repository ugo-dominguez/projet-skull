<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skull - Inscription</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><h1>SKULL</h1></header>
  <main>
    <div class="card">
      <h2>Créer un compte</h2>
      <form id="register-form">
        <label>Email
          <input type="email" id="email" required autocomplete="email">
        </label>
        <label>Pseudo
          <input type="text" id="username" required maxlength="30" autocomplete="username">
        </label>
        <label>Mot de passe
          <input type="password" id="password" required minlength="6" autocomplete="new-password">
        </label>
        <label>Confirmer le mot de passe
          <input type="password" id="confirm" required minlength="6" autocomplete="new-password">
        </label>
        <div class="actions">
          <button type="submit" id="submit-btn">S'inscrire</button>
          <a href="login.html">J'ai déjà un compte</a>
        </div>
      </form>
      <div id="message" class="message" hidden></div>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
