<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Skull - Inscription</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Créer un compte</h1>
    <form id="registerForm">
        <label>Email
            <input type="email" id="email" required>
        </label>
        <label>Nom d'utilisateur
            <input type="text" id="username" required>
        </label>
        <label>Mot de passe (min 6 caractères)
            <input type="password" id="password" minlength="6" required>
        </label>
        <button type="submit">S'inscrire</button>
    </form>
    <p id="msg"></p>
    <p>Déjà un compte ? <a href="login.html">Se connecter</a></p>
</div>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = {
        email: document.getElementById('email').value,
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
    };
    const res = await fetch('/players', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
    });
    const msg = document.getElementById('msg');
    if (res.ok) {
        msg.textContent = 'Compte créé ! Redirection vers la connexion...';
        msg.style.color = 'green';
        setTimeout(() => window.location.href = 'login.html', 1200);
    } else {
        const err = await res.json();
        msg.textContent = err.message || 'Erreur';
        msg.style.color = 'red';
    }
});
</script>
</body>
</html>
